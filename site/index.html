<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fairway &amp; Dials</title>
<meta name="description" content="Curated pre-owned golf clubs and mechanical watches.">
<link rel="icon" href="badge.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1f4d36;
    --brass: #b98a3f;
    --cream: #f3efe4;
    --ink: #1b2620;
    --muted: #4a564f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Jost', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 20px;
    gap: 28px;
  }
  .badge { width: min(220px, 55vw); height: auto; }
  h1 {
    margin: 0;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: clamp(44px, 9vw, 84px);
    line-height: 1;
    color: var(--green);
  }
  h1 .amp { color: var(--brass); font-weight: 500; }
  .rule { width: 96px; height: 2px; background: var(--brass); border: 0; margin: 0; }
  .tag {
    margin: 0;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .pitch { margin: 0; max-width: 34em; font-size: 18px; line-height: 1.6; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    display: inline-flex;
    align-items: center;
    min-height: 48px;
    padding: 0 24px;
    border-radius: 24px;
    font-size: 16px;
    font-weight: 500;
    text-decoration: none;
    border: 1px solid var(--green);
  }
  .btn.primary { background: var(--green); color: var(--cream); }
  .btn.primary:hover { background: #14331f; }
  .btn.secondary { color: var(--green); }
  .btn.secondary:hover { background: #e6e0cf; }
  .btn:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
  button.btn { font-family: inherit; cursor: pointer; }
  button.btn:disabled { opacity: 0.6; cursor: wait; }
  .waitlist { width: 100%; max-width: 30em; display: flex; flex-direction: column; gap: 10px; }
  .waitlist label { font-size: 16px; font-weight: 500; color: var(--ink); }
  .waitlist .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .waitlist input[type=email] {
    flex: 1 1 220px;
    min-height: 48px;
    padding: 0 18px;
    border: 1px solid #8f9a93;
    border-radius: 24px;
    background: #fffdf8;
    color: var(--ink);
    font: inherit;
    font-size: 16px;
  }
  .waitlist input[type=email]:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; border-color: var(--green); }
  .waitlist .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  .status { min-height: 1.5em; margin: 0; font-size: 16px; color: var(--green); }
  .status.error { color: #9b2c1c; }
  footer { padding: 24px 20px; text-align: center; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <img class="badge" src="badge.svg" alt="Fairway &amp; Dials badge: a watch dial with a golf flagstick for a minute hand">
  <h1>Fairway <span class="amp">&amp;</span> Dials</h1>
  <hr class="rule">
  <p class="tag">Golf clubs · Timepieces</p>
  <p class="pitch">Hand-picked pre-owned clubs and mechanical watches, for people who play on Saturday and wear something mechanical doing it. Opening soon.</p>
  <form class="waitlist" id="waitlist" novalidate>
    <label for="wl-email">Get first look when we open</label>
    <div class="row">
      <input id="wl-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required aria-describedby="wl-status">
      <button class="btn primary" type="submit">Join the list</button>
    </div>
    <div class="hp" aria-hidden="true"><label for="wl-company">Company</label><input id="wl-company" name="company" type="text" tabindex="-1" autocomplete="off"></div>
    <p class="status" id="wl-status" role="status" aria-live="polite"></p>
  </form>
  <div class="links">
    <a class="btn secondary" href="https://www.instagram.com/fairwayanddials/">Follow on Instagram</a>
    <a class="btn secondary" href="mailto:hello@fairwayanddials.com">hello@fairwayanddials.com</a>
  </div>
</main>
<footer>© 2026 Fairway &amp; Dials · Seattle</footer>
<script>
(function () {
  var API = 'https://dmtupckcfwbvrkocosjg.supabase.co/rest/v1/waitlist';
  var KEY = 'sb_publishable_gTo3eBcpR79hjgFXTcdieA_ocr3WIvy'; // public key; the table only allows inserts
  var form = document.getElementById('waitlist');
  var input = document.getElementById('wl-email');
  var status = document.getElementById('wl-status');
  var button = form.querySelector('button');
  function say(msg, isError) { status.textContent = msg; status.className = 'status' + (isError ? ' error' : ''); }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (form.company.value) { say("You're on the list. We'll be in touch."); return; }
    var email = input.value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { say('Enter a valid email address.', true); input.focus(); return; }
    button.disabled = true; say('Adding you…');
    var source = new URLSearchParams(location.search).get('ref') || 'site';
    fetch(API, {
      method: 'POST',
      headers: { 'apikey': KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ email: email, source: source.slice(0, 64) })
    }).then(function (r) {
      if (r.ok || r.status === 409) { form.reset(); say("You're on the list. We'll be in touch."); }
      else { throw new Error(r.status); }
    }).catch(function () {
      say('Something went wrong. Try again, or email hello@fairwayanddials.com.', true);
    }).finally(function () { button.disabled = false; });
  });
  input.addEventListener('input', function () { if (status.classList.contains('error')) say(''); });
})();
</script>
</body>
</html>
