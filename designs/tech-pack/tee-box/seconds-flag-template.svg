<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="70mm" viewBox="0 0 100 70"><title>Tee Box seconds hand flag template</title><rect width="100" height="70" fill="#ffffff"/><text x="6" y="8" font-family="Helvetica, Arial, sans-serif" font-size="4" fill="#1b2620">Tee Box seconds hand: flag template (print at 100%)</text><text x="6" y="13" font-family="Helvetica, Arial, sans-serif" font-size="2.4" fill="#4a564f">Check scale: the bar below must measure 50 mm. All sizes in mm.</text><rect x="6" y="15" width="50" height="1" fill="#1b2620"/><text x="6" y="24" font-family="Helvetica, Arial, sans-serif" font-size="2.8" fill="#1b2620">1. Flags to cut (1.96 × 1.46 mm). Cut on the outer edge of the line.</text><polygon points="8,27 9.961,27.731 8,28.462" fill="#b98a3f" stroke="#1b2620" stroke-width="0.05"/><polygon points="22,27 23.961,27.731 22,28.462" fill="#b98a3f" stroke="#1b2620" stroke-width="0.05"/><polygon points="36,27 37.961,27.731 36,28.462" fill="#b98a3f" stroke="#1b2620" stroke-width="0.05"/><polygon points="50,27 51.961,27.731 50,28.462" fill="#b98a3f" stroke="#1b2620" stroke-width="0.05"/><polygon points="64,27 65.961,27.731 64,28.462" fill="#b98a3f" stroke="#1b2620" stroke-width="0.05"/><polygon points="78,27 79.961,27.731 78,28.462" fill="#b98a3f" stroke="#1b2620" stroke-width="0.05"/><text x="6" y="38" font-family="Helvetica, Arial, sans-serif" font-size="2.8" fill="#1b2620">2. Lay the hand on this ruler with its hole on the circle.</text><circle cx="10" cy="50" r="0.6" fill="none" stroke="#1b2620" stroke-width="0.1"/><line x1="10" y1="50" x2="24" y2="50" stroke="#4a564f" stroke-width="0.08"/><line x1="10" y1="48.4" x2="10" y2="50" stroke="#4a564f" stroke-width="0.06"/><text x="10" y="48" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="middle" fill="#4a564f">0</text><line x1="11" y1="49.2" x2="11" y2="50" stroke="#4a564f" stroke-width="0.06"/><line x1="12" y1="49.2" x2="12" y2="50" stroke="#4a564f" stroke-width="0.06"/><line x1="13" y1="49.2" x2="13" y2="50" stroke="#4a564f" stroke-width="0.06"/><line x1="14" y1="49.2" x2="14" y2="50" stroke="#4a564f" stroke-width="0.06"/><line x1="15" y1="48.4" x2="15" y2="50" stroke="#4a564f" stroke-width="0.06"/><text x="15" y="48" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="middle" fill="#4a564f">5</text><line x1="16" y1="49.2" x2="16" y2="50" stroke="#4a564f" stroke-width="0.06"/><line x1="17" y1="49.2" x2="17" y2="50" stroke="#4a564f" stroke-width="0.06"/><line x1="18" y1="49.2" x2="18" y2="50" stroke="#4a564f" stroke-width="0.06"/><line x1="19" y1="49.2" x2="19" y2="50" stroke="#4a564f" stroke-width="0.06"/><line x1="20" y1="48.4" x2="20" y2="50" stroke="#4a564f" stroke-width="0.06"/><text x="20" y="48" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="middle" fill="#4a564f">10</text><line x1="21" y1="49.2" x2="21" y2="50" stroke="#4a564f" stroke-width="0.06"/><line x1="22" y1="49.2" x2="22" y2="50" stroke="#4a564f" stroke-width="0.06"/><line x1="23" y1="49.2" x2="23" y2="50" stroke="#4a564f" stroke-width="0.06"/><line x1="24" y1="49.2" x2="24" y2="50" stroke="#4a564f" stroke-width="0.06"/><polygon points="15.115,50.4 16.577,50.4 15.846,52.361" fill="#b98a3f" opacity="0.8"/><line x1="21.510" y1="47" x2="21.510" y2="53" stroke="#e4007c" stroke-width="0.12"/><text x="22.310" y="53" font-family="Helvetica, Arial, sans-serif" font-size="2" fill="#e4007c">trim tip here: 11.5 mm</text><text x="6" y="59.0" font-family="Helvetica, Arial, sans-serif" font-size="2.3" fill="#4a564f">Flag sits 5.1–6.6 mm from the centre, on the right of the hand when it points to 12.</text><text x="6" y="62.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" fill="#4a564f">Trim the tip with a fine file, re-measure with calipers, touch up the end with black paint.</text><text x="6" y="66.2" font-family="Helvetica, Arial, sans-serif" font-size="2.3" fill="#4a564f">Keep the flag light: vinyl or foil, the smallest dot of glue. At :30 the tip should sit in the cup.</text></svg>
